<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FeelDX Marketing Hub</title>
<style>
  /* ── FeelDX light palette, derived from feeldx.com ──────────────────
     paper #F5F7F2 · card #FFFFFF · line #DDE2D4
     olive-900 #2A2F1E (text) · olive-700 #47512F · olive-500 #5A6640
     Every pairing below clears WCAG AA (4.5:1) at body size.
     Deliberately different from the DX Living hub (navy #2A3143 /
     salmon #F0A48E / blue #2B6CF6) so the two are never confused.  */
  :root{
    --ink:#F5F7F2; --bar:#FFFFFF; --line:#DDE2D4; --hover:#EEF1E9;
    --accent:#5A6640; --accent-deep:#47512F;
    --text:#2A2F1E; --muted:#5C6449; --dim:#666E51;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--ink)}

  #bar{display:flex;align-items:center;gap:4px;height:52px;padding:0 14px;
       background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  #brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;
         font-size:14px;margin-right:16px;letter-spacing:.02em;white-space:nowrap}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
       box-shadow:0 0 0 3px rgba(90,102,64,.14)}

  .tab{appearance:none;border:0;background:transparent;color:var(--muted);font-size:13px;
       font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab:hover{background:var(--hover);color:var(--text)}
  .tab.on{background:var(--accent);color:#F5F7F2;font-weight:600}
  .tab .dotmark{display:inline-block;width:5px;height:5px;border-radius:50%;
                background:var(--dim);margin-left:6px;vertical-align:2px}
  .tab.ready .dotmark{background:var(--accent)}
  .tab.on .dotmark{background:#F5F7F2;opacity:.45}

  #spacer{flex:1}
  #open{color:var(--dim);font-size:12px;text-decoration:none;padding:6px 10px;
        border:1px solid var(--line);border-radius:7px;white-space:nowrap}
  #open:hover{color:var(--text);border-color:var(--accent-deep)}
  #open.off{opacity:.35;pointer-events:none}

  #stage{position:relative;height:calc(100% - 52px)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
  iframe.on{display:block}

  .pane{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
        justify-content:center;text-align:center;padding:40px;background:var(--ink);
        color:var(--muted);font-size:14px;line-height:1.75}
  .pane.on{display:flex}
  .pane h2{color:var(--text);font-size:18px;font-weight:600;margin:0 0 10px}
  .pane p{margin:0 0 6px;max-width:520px}
  .badge{width:48px;height:48px;border-radius:13px;background:var(--accent-deep);
         display:flex;align-items:center;justify-content:center;margin-bottom:18px;
         color:#F5F7F2;font-weight:700;font-size:15px;letter-spacing:.03em}
  code{background:var(--bar);border:1px solid var(--line);color:var(--accent);
       padding:2px 7px;border-radius:5px;font-size:12.5px}
  .btn{display:inline-block;margin-top:18px;background:var(--accent);color:#F5F7F2;
       font-weight:600;font-size:13.5px;text-decoration:none;padding:10px 20px;border-radius:9px}
  .btn:hover{background:#4A5334}

  @media (max-width:680px){
    #bar{height:auto;flex-wrap:wrap;padding:8px 10px;gap:6px}
    #stage{height:calc(100% - 104px)}
    #open{display:none}
  }
</style>
</head>
<body>

<div id="bar">
  <span id="brand"><span id="dot"></span>FeelDX · Marketing Hub</span>
  <span id="tabs"></span>
  <span id="spacer"></span>
  <a id="open" target="_blank" rel="noopener">Open in new tab ↗</a>
</div>

<div id="stage"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Mỗi tab trỏ tới một file báo cáo. `url` để "" nghĩa là chưa có dữ liệu.
   Khi deploy lên GitHub Pages, thay đường dẫn tương đối bằng URL đầy đủ
   nếu báo cáo nằm ở repo khác.
   ═══════════════════════════════════════════════════════════════════ */
const TABS = [
  { key:'seo',    label:'SEO',            url:'feeldx-seo-report.html' },
  { key:'weekly', label:'SEO Weekly',     url:'feeldx-seo-weekly.html' },
  { key:'audit',  label:'Website Audit',  url:'feeldx-website-audit.html' },
  { key:'social', label:'Social',         url:'feeldx-social.html' }
];
/* ═══════════════════════════════════════════════════════════════════ */

const isFile = location.protocol === 'file:';
const tabsWrap = document.getElementById('tabs');
const stage    = document.getElementById('stage');
const openLink = document.getElementById('open');
const panes    = [];

TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' on' : '') + (t.url ? ' ready' : '');
  b.innerHTML = t.label + '<span class="dotmark"></span>';
  b.onclick = () => show(i);
  tabsWrap.appendChild(b);

  let pane;
  if (t.url && !isFile) {
    /* served over http(s): embed it */
    pane = document.createElement('iframe');
    pane.dataset.src = t.url;
    if (i === 0) { pane.src = t.url; pane.className = 'on'; }
  } else if (t.url && isFile) {
    /* opened from disk: browsers block file:// iframes, so offer the link */
    pane = document.createElement('div');
    pane.className = 'pane' + (i === 0 ? ' on' : '');
    pane.innerHTML =
      '<div class="badge">DX</div>' +
      '<h2>' + t.label + '</h2>' +
      '<p>Trang này đang mở bằng <code>file://</code> nên trình duyệt chặn nhúng iframe.</p>' +
      '<p>Bấm nút bên dưới để mở báo cáo, hoặc deploy cả thư mục lên GitHub Pages để 4 tab chạy liền mạch.</p>' +
      '<a class="btn" href="' + t.url + '">Mở ' + t.label + ' →</a>';
  } else {
    pane = document.createElement('div');
    pane.className = 'pane' + (i === 0 ? ' on' : '');
    pane.innerHTML =
      '<div class="badge">DX</div>' +
      '<h2>' + t.label + ' — chưa có dữ liệu</h2>' +
      '<p>' + (t.why ? t.why.vi : '') + '</p>' +
      (t.need ? '<p style="color:var(--accent);margin-top:14px">' + t.need.vi + '</p>' : '') +
      (t.why ? '<p style="color:#6E7659;margin-top:16px;font-size:13px">' + t.why.en +
               (t.need ? '<br><br>' + t.need.en : '') + '</p>' : '');
  }
  stage.appendChild(pane);
  panes.push(pane);
});

function show(i) {
  [...tabsWrap.children].forEach((b, n) => b.classList.toggle('on', n === i));
  panes.forEach((p, n) => {
    p.classList.toggle('on', n === i);
    if (n === i && p.tagName === 'IFRAME' && !p.src) p.src = p.dataset.src;
  });
  const u = TABS[i].url;
  openLink.href = u || '#';
  openLink.classList.toggle('off', !u);
  location.hash = TABS[i].key;
}

openLink.href = TABS[0].url || '#';
openLink.classList.toggle('off', !TABS[0].url);

const start = TABS.findIndex(t => t.key === location.hash.slice(1));
if (start > 0) show(start);

/* Back/forward and links pasted into an already-open tab change only the
   hash, which does not reload the page — so react to it explicitly. */
window.addEventListener('hashchange', () => {
  const i = TABS.findIndex(t => t.key === location.hash.slice(1));
  if (i >= 0 && !panes[i].classList.contains('on')) show(i);
});
</script>

</body>
</html>
